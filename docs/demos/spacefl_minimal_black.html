<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceFL 黑底简约示意动画</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#f2f2f2;font-family:"Segoe UI","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:18px}.stage{position:relative;width:min(1440px,100%);aspect-ratio:16/9;min-height:500px;background:#050505;overflow:hidden;border:1px solid #262626}canvas{width:100%;height:100%;display:block}.title{position:absolute;left:32px;top:24px;font-size:clamp(18px,2.2vw,30px);font-weight:700;letter-spacing:.03em}.sub{position:absolute;left:34px;top:61px;color:#989898;font-size:clamp(11px,1.1vw,15px)}.hint{position:absolute;right:30px;top:27px;color:#777;font-size:12px}.controls{position:absolute;right:30px;bottom:24px;display:flex;gap:7px}.legend{position:absolute;left:34px;bottom:25px;display:flex;gap:20px;color:#aaa;font-size:12px}.key{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%}button{background:#111;color:#ddd;border:1px solid #444;border-radius:4px;padding:6px 10px;cursor:pointer}
</style></head>
<body><main class="stage"><canvas id="c"></canvas><div class="title">SpaceFL · 太空联邦学习</div><div class="sub">本地训练持续进行　·　仅在通信窗口传输模型更新</div><div class="hint">概念示意 · 非真实轨道比例</div><div class="legend"><span class="key"><i class="dot" style="background:#6e9dff"></i>星上本地训练</span><span class="key"><i class="dot" style="background:#55e39b"></i>模型更新传输</span></div><div class="controls"><button id="toggle">暂停</button><button id="reset">重置</button></div></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),root=document.querySelector('.stage');let W,H,dpr,t=0,last=performance.now(),run=true;
const N=6, orbiters=Array.from({length:N},(_,i)=>({phase:i*Math.PI*2/N+.2,speed:.00035+(i%3)*.000055,local:(i*.17)%1}));
function size(){const r=root.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function label(px,py,text,color){x.font='12px Segoe UI,Microsoft YaHei,sans-serif';const w=x.measureText(text).width+18;x.fillStyle='#0b0b0b';x.strokeStyle=color;x.lineWidth=1;x.beginPath();x.roundRect(px,py,w,25,2);x.fill();x.stroke();x.fillStyle=color;x.textAlign='center';x.textBaseline='middle';x.fillText(text,px+w/2,py+12.5);return w}
function earth(cx,cy,r){x.save();const g=x.createRadialGradient(cx-r*.32,cy-r*.4,3,cx,cy,r);g.addColorStop(0,'#b9b9b9');g.addColorStop(1,'#525252');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill();x.strokeStyle='#e2e2e2';x.lineWidth=1.5;x.stroke();x.globalAlpha=.19;x.strokeStyle='#fff';x.beginPath();x.ellipse(cx,cy,r*.96,r*.37,-.35,0,Math.PI*2);x.stroke();x.beginPath();x.ellipse(cx,cy,r*.43,r*.96,-.35,0,Math.PI*2);x.stroke();x.restore()}
function satellite(px,py,angle,training=true){x.save();x.translate(px,py);x.rotate(angle+.9);x.fillStyle='#dedede';x.strokeStyle='#181818';x.lineWidth=1;x.fillRect(-7,-5,14,10);x.strokeRect(-7,-5,14,10);x.fillStyle='#738ba2';x.fillRect(-15,-3,7,6);x.fillRect(8,-3,7,6);x.restore();if(training){x.strokeStyle='rgba(110,157,255,.72)';x.lineWidth=2;x.beginPath();x.arc(px,py,13+4*(.5+.5*Math.sin(t*.006+px)),0,Math.PI*1.55);x.stroke()}}
function groundStation(px,py,nx,ny){const ux=nx,uy=ny;x.save();x.translate(px,py);x.rotate(Math.atan2(uy,ux));x.strokeStyle='#f0f0f0';x.lineWidth=2;x.beginPath();x.moveTo(0,0);x.lineTo(0,-17);x.moveTo(-8,-1);x.lineTo(0,-8);x.lineTo(8,-1);x.stroke();x.beginPath();x.arc(0,-18,7,-Math.PI*.83,-Math.PI*.17);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(0,0,3.2,0,Math.PI*2);x.fill();x.restore()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#050505';x.fillRect(0,0,W,H);const cx=W*.5,cy=H*.54,er=Math.min(W,H)*.145,rx=Math.min(W*.31,H*.48),ry=rx*.51,stationAngle=-.58;const sx=cx+Math.cos(stationAngle)*er,sy=cy+Math.sin(stationAngle)*er;const active=[];for(let i=0;i<N;i++){const a=orbiters[i].phase+t*orbiters[i].speed;const da=Math.abs(norm(a-stationAngle));if(da<.27)active.push({i,a,da})}
x.strokeStyle='#505050';x.lineWidth=1.2;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.stroke();earth(cx,cy,er);
const stationNx=Math.cos(stationAngle),stationNy=Math.sin(stationAngle);groundStation(sx,sy,stationNx,stationNy);
orbiters.forEach((s,i)=>{const a=s.phase+t*s.speed,px=cx+Math.cos(a)*rx,py=cy+Math.sin(a)*ry; satellite(px,py,a,true);x.fillStyle='#aaa';x.font='11px Segoe UI,Microsoft YaHei,sans-serif';x.textAlign='center';x.fillText(`S${i+1}`,px,py-18)});
if(active.length){const {i,a}=active[0],px=cx+Math.cos(a)*rx,py=cy+Math.sin(a)*ry;x.save();x.strokeStyle='#55e39b';x.lineWidth=2;x.setLineDash([6,5]);x.beginPath();x.moveTo(sx,sy);x.lineTo(px,py);x.stroke();x.setLineDash([]);x.fillStyle='#55e39b';for(let k=0;k<4;k++){const q=(t*.0007+k*.25)%1;const bx=sx+(px-sx)*q,by=sy+(py-sy)*q;x.beginPath();x.arc(bx,by,3,0,Math.PI*2);x.fill()}x.restore();const tx=Math.min(sx,px)+Math.abs(px-sx)*.25,ty=Math.min(sy,py)-32;label(tx,ty,'通信窗口：模型更新','#55e39b')}
const trainX=34,trainY=H*.29;label(trainX,trainY,'星上本地训练','#8bb5ff');x.fillStyle='#aaa';x.font='12px Segoe UI,Microsoft YaHei,sans-serif';x.textAlign='left';x.fillText('各卫星独立使用本地数据，训练过程持续进行',trainX,trainY+43);
const stationLabelX=sx+stationNx*26,stationLabelY=sy+stationNy*26;label(stationLabelX,stationLabelY,'地面站','#eee');
const caption=active.length?`S${active[0].i+1}进入可见窗口，正在向地面站发送模型更新`:'卫星继续本地训练，等待进入地面站可见窗口';x.fillStyle='#c9c9c9';x.font='13px Segoe UI,Microsoft YaHei,sans-serif';x.textAlign='center';x.fillText(caption,W/2,H*.88)}
function loop(now){const dt=Math.min(60,now-last);last=now;if(run)t+=dt;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.querySelector('#toggle').onclick=()=>{run=!run;document.querySelector('#toggle').textContent=run?'暂停':'继续'};document.querySelector('#reset').onclick=()=>{t=0;last=performance.now()};
</script></body></html>
