<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpaceFL 科研智能平台 · 在线演示</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #050506; color: #e8e8ea; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px; border-bottom: 1px solid #1b1b1f; flex-wrap: wrap; }
    .brand { letter-spacing: .28em; font-size: 13px; color: #fff; }
    .brand small { display: block; letter-spacing: .18em; color: #8a8a93; font-size: 10px; margin-top: 3px; }
    .meta { color: #8a8a93; font-size: 12px; }
    .actions a { color: #050506; background: #fff; text-decoration: none; padding: 9px 14px; font-size: 12px; letter-spacing: .08em; }
    .actions a.secondary { background: transparent; color: #e8e8ea; border: 1px solid #333; margin-left: 8px; }
    iframe { display: block; width: 100%; height: calc(100vh - 110px); border: 0; background: #050506; }
    .hint { padding: 10px 22px; color: #8a8a93; font-size: 12px; border-top: 1px solid #1b1b1f; line-height: 1.7; }
    .hint code { color: #d8cba8; }
    .hint button { background: transparent; color: #e8e8ea; border: 1px solid #333; padding: 6px 10px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">SPACEFL<small>RESEARCH PLATFORM · ONLINE DEMO</small></div>
    <div class="meta">太空联邦学习科研智能平台 · 公网演示入口</div>
    <div class="actions">
      <a id="fullscreen" href="#" target="_blank" rel="noopener">全屏打开</a>
      <a class="secondary" href="https://github.com/Bilze-python/fl_space" target="_blank" rel="noopener">源码仓库</a>
    </div>
  </header>
  <iframe id="demo" src="about:blank" title="SpaceFL 科研智能平台在线演示" allow="clipboard-read; clipboard-write"></iframe>
  <div class="hint">
    <span id="status">正在连接演示实例…</span>
    演示使用离线规则引擎与预置数据；训练、导入与配置写入已禁用。
    若页面暂时无法加载，请点击“全屏打开”或稍等 30–60 秒。
    <button id="retry" type="button">重新连接</button>
  </div>
  <script>
    (function () {
      var frame = document.getElementById("demo");
      var full = document.getElementById("fullscreen");
      var status = document.getElementById("status");
      var retry = document.getElementById("retry");
      var current = "";

      async function load() {
        try {
          var response = await fetch("./live.json?t=" + Date.now(), { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          var data = await response.json();
          if (!data || !data.url) throw new Error("missing url");
          if (data.url !== current) {
            current = data.url;
            frame.src = data.url + (data.url.indexOf("#") >= 0 ? "" : "#overview");
            full.href = data.url;
            status.textContent = "已连接：" + data.url + "（每 60 秒自动检查更新）";
          }
        } catch (error) {
          status.textContent = "演示实例暂时不可用（" + error.message + "），请点击“重新连接”或稍后再试。";
        }
      }

      retry.addEventListener("click", load);
      load();
      setInterval(load, 60000);
    })();
  </script>
</body>
</html>
