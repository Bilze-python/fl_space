<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpaceFL 科研智能平台 · 在线演示</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #050506; color: #e8e8ea;
      font-family: "Bahnschrift", "Segoe UI", "Microsoft YaHei", sans-serif;
      display: grid; place-items: center;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 70% 20%, rgba(80, 110, 190, .16), transparent 42%),
                  radial-gradient(circle at 20% 80%, rgba(160, 140, 80, .08), transparent 40%);
    }
    .shell { position: relative; width: min(520px, calc(100vw - 40px)); }
    .brand { letter-spacing: .34em; font-size: 18px; font-weight: 700; }
    .brand small { display: block; margin-top: 6px; letter-spacing: .26em; font-size: 10px; color: #8a8a93; }
    .rule { height: 1px; background: linear-gradient(90deg, #fff, #333 60%, transparent); margin: 22px 0; }
    .kicker { font-size: 10px; letter-spacing: .3em; color: #a9a9b2; margin-bottom: 12px; }
    h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: .06em; }
    p { color: #9b9ba4; font-size: 13px; line-height: 1.9; margin: 0 0 18px; }
    a.button {
      display: inline-block; background: #fff; color: #050506; text-decoration: none;
      padding: 13px 20px; font-size: 12px; font-weight: 700; letter-spacing: .14em;
    }
    a.button:hover { background: #d9d9de; }
    code { color: #d8cba8; }
    .note { margin-top: 22px; color: #66666f; font-size: 11px; line-height: 1.9; }
    .note a { color: #bdbdc6; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">SPACEFL<small>RESEARCH PLATFORM · ONLINE DEMO</small></div>
    <div class="rule"></div>
    <p class="kicker">PUBLIC DEMO · SECURE ACCESS</p>
    <h1>进入在线演示</h1>
    <p>主演示部署在 Render 上，需要比赛账号登录。点击下方按钮将跳转到主站；登录后即可体验文献精读、实验规划与实验档案解读。</p>
    <a class="button" id="open" href="https://spacefl-research-agent.onrender.com/" target="_blank" rel="noopener">打开 SpaceFL 演示</a>
    <p class="note">
      备选直接地址：<code id="url">https://spacefl-research-agent.onrender.com/</code><br />
      若主站冷启动较慢，请等待 30–60 秒后刷新。<br />
      源码：<a href="https://github.com/Bilze-python/fl_space" target="_blank" rel="noopener">Bilze-python/fl_space</a>
    </p>
  </main>
  <script>
    // live.json is kept up to date; top-level navigation avoids third-party-cookie
    // issues with login sessions inside a cross-origin iframe.
    (async function () {
      try {
        const response = await fetch("./live.json?t=" + Date.now(), { cache: "no-store" });
        const data = await response.json();
        if (data && data.url) {
          document.getElementById("open").href = data.url;
          document.getElementById("url").textContent = data.url;
        }
      } catch (error) {
        /* keep the default Render URL */
      }
    })();
  </script>
</body>
</html>
