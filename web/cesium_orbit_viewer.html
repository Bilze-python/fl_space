<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceFL 轨道可视化</title>
    <!-- 使用unpkg CDN，更稳定 -->
    <script src="https://unpkg.com/cesium@1.114.0/Build/Cesium/Cesium.js"></script>
    <link href="https://unpkg.com/cesium@1.114.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a1929; color: white; }
        #cesiumContainer { width: 100vw; height: 100vh; }
        .controls {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
            max-width: 300px;
        }
        .controls h3 { margin-bottom: 15px; color: #4fd18b; }
        .controls button {
            width: 100%; padding: 10px; margin: 5px 0;
            background: #4fd18b; border: none; border-radius: 5px;
            color: black; font-weight: bold; cursor: pointer;
        }
        .controls button:hover { background: #3fb573; }
        .stats {
            position: absolute; bottom: 20px; left: 20px; z-index: 1000;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px;
        }
        .stats div { margin: 5px 0; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <div class="controls">
        <h3>🛰️ SpaceFL 轨道控制</h3>
        <button onclick="loadOrbitData()">加载轨道数据</button>
        <button onclick="playAnimation()">播放动画</button>
        <button onclick="pauseAnimation()">暂停</button>
        <button onclick="resetView()">重置视角</button>
    </div>

    <div class="stats">
        <div>卫星数: <span id="satCount">0</span></div>
        <div>地面站: <span id="gsCount">0</span></div>
        <div>活跃连接: <span id="linkCount">0</span></div>
        <div>时隙: <span id="currentSlot">0</span> / <span id="totalSlots">0</span></div>
    </div>

    <script>
        // 初始化Cesium - 使用真实地球影像
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5N2U2MjcwOS00ZjJlLTQzYjYtYWM0ZC1mMmFhYTMyYzVhMzciLCJpZCI6ODQsInNjb3BlcyI6WyJhc3IiLCJnYyJdLCJpYXQiOjE1NTMxNDA4Nzh9.lCLJpAJJD-7H1CjvLBwOjbDRrQS8qPBfSc6_JWPqmVR3wnVdClH2u1r7dDsF5U8lT5ZfEh6UKdZRXzVEXgJJZQ';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: false,
            geocoder: false,
            homeButton: true,
            sceneModePicker: true,
            navigationHelpButton: false,
            animation: false,
            timeline: true,
            fullscreenButton: true,
            imageryProvider: new Cesium.TileMapServiceImageryProvider({
                url: Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
            }),
            skyBox: new Cesium.SkyBox({
                sources: {
                    positiveX: 'https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_px.jpg',
                    negativeX: 'https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_mx.jpg',
                    positiveY: 'https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_py.jpg',
                    negativeY: 'https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_my.jpg',
                    positiveZ: 'https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_pz.jpg',
                    negativeZ: 'https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_mz.jpg'
                }
            }),
            skyAtmosphere: new Cesium.SkyAtmosphere()
        });

        viewer.scene.globe.enableLighting = true;

        let orbitData = null;
        let currentSlot = 0;
        let animationTimer = null;
        let satelliteEntities = [];
        let gsEntities = [];
        let linkEntities = [];

        // 加载SpaceFL轨道数据
        async function loadOrbitData() {
            try {
                // 使用相对路径，从同一服务器加载
                const response = await fetch('/api/orbit_data?sats=10&gs=5&sim_hours=2&altitude_km=500&inclination_deg=53&timeslot_min=2&isl_enabled=false');
                orbitData = await response.json();

                // 更新统计
                document.getElementById('satCount').textContent = orbitData.satellites;
                document.getElementById('gsCount').textContent = orbitData.ground_stations.length;
                document.getElementById('totalSlots').textContent = orbitData.timeslots.length;

                // 创建地面站
                createGroundStations();

                // 显示第一个时隙
                updateSlot(0);

                alert('轨道数据加载成功！');
            } catch (error) {
                alert('加载失败: ' + error.message);
            }
        }

        // 创建地面站标记
        function createGroundStations() {
            orbitData.ground_stations.forEach((gs, i) => {
                const entity = viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(gs.lon, gs.lat, 10),
                    billboard: {
                        image: createGroundStationIcon(),
                        scale: 0.5,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM
                    },
                    label: {
                        text: `GS${i}`,
                        font: '14px sans-serif',
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK,
                        outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.TOP,
                        pixelOffset: new Cesium.Cartesian2(0, 10)
                    }
                });
                gsEntities.push(entity);
            });
        }

        // 创建地面站图标
        function createGroundStationIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            // 绘制天线
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.moveTo(32, 10);
            ctx.lineTo(20, 50);
            ctx.lineTo(44, 50);
            ctx.closePath();
            ctx.fill();

            // 绘制基座
            ctx.fillRect(25, 50, 14, 10);

            return canvas;
        }

        // 创建卫星图标
        function createSatelliteIcon(active) {
            const canvas = document.createElement('canvas');
            canvas.width = 48;
            canvas.height = 48;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = active ? '#00ff88' : '#3498db';

            // 卫星主体
            ctx.fillRect(18, 18, 12, 12);

            // 太阳能板
            ctx.fillRect(5, 20, 10, 8);
            ctx.fillRect(33, 20, 10, 8);

            // 天线
            ctx.beginPath();
            ctx.moveTo(24, 10);
            ctx.lineTo(24, 18);
            ctx.strokeStyle = ctx.fillStyle;
            ctx.lineWidth = 2;
            ctx.stroke();

            return canvas;
        }

        // 更新时隙显示
        function updateSlot(slotIndex) {
            if (!orbitData) return;

            currentSlot = slotIndex;
            const slot = orbitData.timeslots[slotIndex];

            // 清除旧的卫星和连接
            satelliteEntities.forEach(e => viewer.entities.remove(e));
            linkEntities.forEach(e => viewer.entities.remove(e));
            satelliteEntities = [];
            linkEntities = [];

            // 绘制卫星
            slot.positions.forEach((sat, i) => {
                const hasContact = slot.contacts.some(c => c.sat_id === i);

                const entity = viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(sat.lon, sat.lat, 500000), // 500km高度
                    billboard: {
                        image: createSatelliteIcon(hasContact),
                        scale: 0.6,
                        verticalOrigin: Cesium.VerticalOrigin.CENTER
                    },
                    label: {
                        text: `S${i}`,
                        font: '12px sans-serif',
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK,
                        outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.TOP,
                        pixelOffset: new Cesium.Cartesian2(0, 20)
                    }
                });
                satelliteEntities.push(entity);
            });

            // 绘制连接线
            slot.contacts.forEach(contact => {
                const sat = slot.positions[contact.sat_id];
                const gs = orbitData.ground_stations[contact.gs_id];

                const entity = viewer.entities.add({
                    polyline: {
                        positions: Cesium.Cartesian3.fromDegreesArrayHeights([
                            sat.lon, sat.lat, 500000,
                            gs.lon, gs.lat, 0
                        ]),
                        width: 2,
                        material: Cesium.Color.YELLOW.withAlpha(0.6)
                    }
                });
                linkEntities.push(entity);
            });

            // 更新统计
            document.getElementById('currentSlot').textContent = slotIndex;
            document.getElementById('linkCount').textContent = slot.contacts.length;
        }

        // 播放动画
        function playAnimation() {
            if (!orbitData) {
                alert('请先加载轨道数据');
                return;
            }

            if (animationTimer) clearInterval(animationTimer);

            animationTimer = setInterval(() => {
                currentSlot = (currentSlot + 1) % orbitData.timeslots.length;
                updateSlot(currentSlot);
            }, 500); // 每0.5秒一帧
        }

        // 暂停动画
        function pauseAnimation() {
            if (animationTimer) {
                clearInterval(animationTimer);
                animationTimer = null;
            }
        }

        // 重置视角
        function resetView() {
            viewer.camera.flyHome(1);
        }

        // 自动加载数据
        setTimeout(() => {
            if (confirm('是否自动加载轨道数据？')) {
                loadOrbitData();
            }
        }, 1000);
    </script>
</body>
</html>
